<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent !important;
        overflow: hidden;
    }

    body {
        background-color: rgba(0, 0, 0, 0) !important;
    }

    .overlay {
        position: fixed;
        inset: 0;
        background: transparent !important;
        overflow: hidden;
        pointer-events: none;
    }

    .mask {
        position: absolute;
        background: rgba(255, 255, 255, 1);
        pointer-events: none;
        will-change: transform;
    }

    .mask1 {
        width: 55px;
        height: 150px;
        animation: move1 0.42s linear infinite;
    }

    .mask2 {
        width: 45px;
        height: 120px;
        animation: move2 0.34s linear infinite;
    }

    .mask3 {
        width: 50px;
        height: 140px;
        animation: move3 0.38s linear infinite;
    }

    .mask4 {
        width: 40px;
        height: 110px;
        animation: move4 0.30s linear infinite;
    }

    @keyframes move1 {
        0%   { transform: translate(-100px, 10vh); }
        25%  { transform: translate(30vw, 35vh); }
        50%  { transform: translate(70vw, 10vh); }
        75%  { transform: translate(35vw, 70vh); }
        100% { transform: translate(-100px, 10vh); }
    }

    @keyframes move2 {
        0%   { transform: translate(80vw, 70vh); }
        25%  { transform: translate(55vw, 20vh); }
        50%  { transform: translate(10vw, 65vh); }
        75%  { transform: translate(65vw, 40vh); }
        100% { transform: translate(80vw, 70vh); }
    }

    @keyframes move3 {
        0%   { transform: translate(15vw, -150px); }
        25%  { transform: translate(70vw, 20vh); }
        50%  { transform: translate(30vw, 75vh); }
        75%  { transform: translate(-100px, 35vh); }
        100% { transform: translate(15vw, -150px); }
    }

    @keyframes move4 {
        0%   { transform: translate(70vw, 90vh); }
        25%  { transform: translate(20vw, 60vh); }
        50%  { transform: translate(75vw, 30vh); }
        75%  { transform: translate(35vw, -100px); }
        100% { transform: translate(70vw, 90vh); }
    }
</style>
</head>

<body>
<div class="overlay">
    <div class="mask mask1"></div>
    <div class="mask mask2"></div>
    <div class="mask mask3"></div>
    <div class="mask mask4"></div>
</div>
</body>
</html>
