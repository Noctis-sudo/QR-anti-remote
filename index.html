<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<style>

    html, body {

        margin: 0;

        padding: 0;

        width: 100vw;

        height: 100vh;

        overflow: hidden;

        background: transparent;

    }

    .overlay {

        position: fixed;

        inset: 0;

        pointer-events: none;

        overflow: hidden;

        background: transparent;

    }

    .mask {

        position: absolute;

        background: white;

        pointer-events: none;

        will-change: transform;

    }

    /* 第一块 */

    .m1 {

        width: 55px;

        height: 170px;

        animation: move1 0.42s linear infinite;

    }

    /* 第二块 */

    .m2 {

        width: 45px;

        height: 130px;

        animation: move2 0.31s linear infinite;

    }

    /* 第三块 */

    .m3 {

        width: 60px;

        height: 150px;

        animation: move3 0.37s linear infinite;

    }

    /* 第四块 */

    .m4 {

        width: 40px;

        height: 110px;

        animation: move4 0.28s linear infinite;

    }

    @keyframes move1 {

        0%   { transform: translate(-100px, 50px); }

        25%  { transform: translate(300px, 150px); }

        50%  { transform: translate(600px, 50px); }

        75%  { transform: translate(300px, 400px); }

        100% { transform: translate(-100px, 50px); }

    }

    @keyframes move2 {

        0%   { transform: translate(600px, 400px); }

        25%  { transform: translate(350px, 100px); }

        50%  { transform: translate(50px, 350px); }

        75%  { transform: translate(400px, 250px); }

        100% { transform: translate(600px, 400px); }

    }

    @keyframes move3 {

        0%   { transform: translate(100px, -150px); }

        25%  { transform: translate(450px, 100px); }

        50%  { transform: translate(200px, 450px); }

        75%  { transform: translate(-100px, 200px); }

        100% { transform: translate(100px, -150px); }

    }

    @keyframes move4 {

        0%   { transform: translate(450px, 500px); }

        25%  { transform: translate(100px, 300px); }

        50%  { transform: translate(500px, 150px); }

        75%  { transform: translate(200px, -100px); }

        100% { transform: translate(450px, 500px); }

    }

</style>

</head>

<body>

<div class="overlay">

    <div class="mask m1"></div>

    <div class="mask m2"></div>

    <div class="mask m3"></div>

    <div class="mask m4"></div>

</div>

</body>

</html>
