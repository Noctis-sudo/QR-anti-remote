<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent !important;
    }

    body {
        background-color: rgba(0, 0, 0, 0) !important;
    }

    .overlay {
        position: fixed;
        inset: 0;
        background: transparent !important;
        overflow: hidden;
        pointer-events: none;
    }

    .mask {
        position: absolute;
        background: rgba(255, 255, 255, 1);
        pointer-events: none;
        will-change: transform;
    }

    .mask1, .m1 {
        width: 55px;
        height: 170px;
        animation: move1 0.42s linear infinite;
    }

    .mask2, .m2 {
        width: 45px;
        height: 130px;
        animation: move2 0.34s linear infinite;
    }

    .mask3, .m3 {
        width: 60px;
        height: 150px;
        animation: move3 0.38s linear infinite;
    }

    .mask4, .m4 {
        width: 40px;
        height: 110px;
        animation: move4 0.30s linear infinite;
    }

    @keyframes move1 {
        0%   { transform: translate(-100px, 50px); }
        25%  { transform: translate(300px, 150px); }
        50%  { transform: translate(600px, 50px); }
        75%  { transform: translate(300px, 400px); }
        100% { transform: translate(-100px, 50px); }
    }

    @keyframes move2 {
        0%   { transform: translate(600px, 400px); }
        25%  { transform: translate(350px, 100px); }
        50%  { transform: translate(50px, 350px); }
        75%  { transform: translate(400px, 250px); }
        100% { transform: translate(600px, 400px); }
    }

    @keyframes move3 {
        0%   { transform: translate(100px, -150px); }
        25%  { transform: translate(450px, 100px); }
        50%  { transform: translate(200px, 450px); }
        75%  { transform: translate(-100px, 200px); }
        100% { transform: translate(100px, -150px); }
    }

    @keyframes move4 {
        0%   { transform: translate(450px, 500px); }
        25%  { transform: translate(100px, 300px); }
        50%  { transform: translate(500px, 150px); }
        75%  { transform: translate(200px, -100px); }
        100% { transform: translate(450px, 500px); }
    }
</style>
</head>

<body>
<div class="overlay">
    <div class="mask mask1 m1"></div>
    <div class="mask mask2 m2"></div>
    <div class="mask mask3 m3"></div>
    <div class="mask mask4 m4"></div>
</div>
</body>

</html>
