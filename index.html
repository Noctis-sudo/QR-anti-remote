<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

    * {

        box-sizing: border-box;

    }

    html, body {

        margin: 0;

        width: 100%;

        height: 100%;

        overflow: hidden;

        background: transparent;

    }

    .qr {

        position: relative;

        width: 500px;

        height: 500px;

        overflow: hidden;

    }

    .qr img {

        width: 100%;

        height: 100%;

        display: block;

    }

    /* 遮挡层 */

    .mask {

        position: absolute;

        width: 70px;

        height: 180px;

        background: white;

        pointer-events: none;

    }

    .mask1 {

        animation: move1 0.32s linear infinite;

    }

    .mask2 {

        animation: move2 0.41s linear infinite;

    }

    .mask3 {

        animation: move3 0.27s linear infinite;

    }

    .mask4 {

        animation: move4 0.36s linear infinite;

    }

    @keyframes move1 {

        0%   { left: -80px;  top: 20px; }

        25%  { left: 180px;  top: 260px; }

        50%  { left: 420px;  top: 80px; }

        75%  { left: 220px;  top: 400px; }

        100% { left: -80px;  top: 20px; }

    }

    @keyframes move2 {

        0%   { left: 420px; top: 350px; }

        25%  { left: 250px; top: 100px; }

        50%  { left: 0px;   top: 300px; }

        75%  { left: 300px; top: 0px; }

        100% { left: 420px; top: 350px; }

    }

    @keyframes move3 {

        0%   { left: 100px; top: -100px; }

        25%  { left: 350px; top: 100px; }

        50%  { left: 150px; top: 350px; }

        75%  { left: -80px; top: 150px; }

        100% { left: 100px; top: -100px; }

    }

    @keyframes move4 {

        0%   { left: 300px; top: 500px; }

        25%  { left: 50px;  top: 300px; }

        50%  { left: 350px; top: 150px; }

        75%  { left: 100px; top: -100px; }

        100% { left: 300px; top: 500px; }

    }

</style>

</head>

<body>

<div class="qr">

    <img src="feishu-qr.png">

    <div class="mask mask1"></div>

    <div class="mask mask2"></div>

    <div class="mask mask3"></div>

    <div class="mask mask4"></div>

</div>

</body>

</html>
